<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kokoro settings</title>
    <style>
      body {
        max-width: 34rem;
        margin: 3rem auto;
        padding: 0 1rem;
        font: 16px system-ui;
        color: #182028;
        background: #f8fafb;
      }
      label {
        display: block;
        margin: 1rem 0;
      }
      input {
        display: block;
        box-sizing: border-box;
        width: 100%;
        margin-top: 0.4rem;
        padding: 0.6rem;
        font: inherit;
      }
      button {
        padding: 0.65rem 1rem;
        font: inherit;
      }
      #status {
        min-height: 1.5rem;
      }
    </style>
  </head>
  <body>
    <h1>Kokoro settings</h1>
    <p>Connect to your local speech server.</p>
    <form id="settings">
      <label>Server URL<input id="base-url" type="url" required /></label>
      <label
        >Server token<input
          id="token"
          type="password"
          autocomplete="off"
          required
      /></label>
      <label
        >Voice<input id="voice" list="voices" required /><datalist
          id="voices"
        ></datalist
      ></label>
      <label
        >Speed<input
          id="speed"
          type="number"
          min="0.5"
          max="2"
          step="0.1"
          required
      /></label>
      <button type="submit">Save settings</button>
      <button type="button" id="test">Test connection</button>
    </form>
    <p id="status" role="status"></p>
    <script src="options.js"></script>
  </body>
</html>
